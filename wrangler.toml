name = "discordapi-ad-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[triggers]
crons = ["0 * * * *", "0 0 * * *"]

# Cloudflare D1 (SQLite). Replaces the previous Postgres+Hyperdrive setup.
# `wrangler dev` uses a local SQLite file backed by Miniflare; `--remote` and
# `wrangler d1 execute|migrations` target the real database keyed by `database_id`.
[[d1_databases]]
binding = "DB"
database_name = "discordadserver"
database_id = "09eb756f-575a-4405-9cbf-6aa2386fcde7"

[[unsafe.bindings]]
name = "SERVE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "CLICK_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[env.staging]
name = "discordapi-ad-server-staging"

[env.staging.triggers]
crons = ["0 * * * *", "0 0 * * *"]

# Staging shares the same D1 database for now. Provision a separate one and
# swap `database_id` here when traffic / data isolation is needed.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "discordadserver"
database_id = "09eb756f-575a-4405-9cbf-6aa2386fcde7"

[[env.staging.unsafe.bindings]]
name = "SERVE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1011"
simple = { limit = 60, period = 60 }

[[env.staging.unsafe.bindings]]
name = "CLICK_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1012"
simple = { limit = 10, period = 60 }

[env.production]
name = "discordapi-ad-server"

[env.production.triggers]
crons = ["0 * * * *", "0 0 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "discordadserver"
database_id = "09eb756f-575a-4405-9cbf-6aa2386fcde7"

[[env.production.unsafe.bindings]]
name = "SERVE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1021"
simple = { limit = 60, period = 60 }

[[env.production.unsafe.bindings]]
name = "CLICK_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1022"
simple = { limit = 10, period = 60 }
